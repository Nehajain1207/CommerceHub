spring.datasource.url=jdbc:h2:mem:notifications;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.kafka.order-events-topic=commercehub.order-events
spring.kafka.consumer.group-id=notification-service
# Tests call the handler directly; nothing connects to Kafka
spring.kafka.listener.auto-startup=false
jwt.secret=test-only-secret-0123456789-0123456789-abcdef
