spring.application.name=notification-service
server.port=8091

# This service has its OWN database (port 5436). It never reads the shop's tables;
# everything it knows about orders arrives as Kafka events.
spring.datasource.url=jdbc:postgresql://localhost:5436/notifications
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
# The schema is created and changed ONLY by the SQL files in db/migration (Flyway).
# Hibernate just checks at start-up that the tables match the Java classes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.kafka.order-events-topic=commercehub.order-events
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
# On first start, read events from the beginning of the topic rather than only new ones
spring.kafka.consumer.auto-offset-reset=earliest

# Must be the same secret as the shop back end, so login tokens issued there are accepted here
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
