# CommerceHub: everything in one file.
#
#   docker compose up -d
#       Only the infrastructure (databases, Kafka, Redis, Prometheus, Grafana).
#       Use this while you run the Java services and the React app yourself, as before.
#
#   docker compose --profile app up -d --build
#       The whole system in Docker: 2 copies of the back end behind an nginx load balancer,
#       the notification service and the React app. Open http://localhost:8080
#
# Grafana dashboard: http://localhost:3000 (user admin, password admin)
services:

  # The shop's database
  postgres:
    image: postgres:16
    container_name: commercehub_postgres
    environment:
      POSTGRES_DB: commercehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    command: ["postgres", "-c", "max_connections=200"]
    ports:
      - "5435:5432"      # 5435 on your computer, so it does not clash with other projects
    volumes:
      - commercehub_data:/var/lib/postgresql/data

  # The notification service's own database. Each service owns its data.
  notifications-db:
    image: postgres:16
    container_name: commercehub_notifications_db
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5436:5432"
    volumes:
      - notifications_data:/var/lib/postgresql/data

  # Kafka: carries order events from the shop to the notification service.
  # One broker in KRaft mode (no ZooKeeper). Two listeners: "kafka:19092" for programs inside
  # Docker, and "localhost:9092" for programs running directly on your computer.
  kafka:
    image: apache/kafka:3.9.0
    container_name: commercehub_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # Redis: catalogue cache, flash-sale stock gate, rate limits, outbox leader lock
  redis:
    image: redis:7
    container_name: commercehub_redis
    ports:
      # 6380 on your computer, so it never clashes with another project's Redis on 6379.
      # Programs inside Docker still use redis:6379. If you run the back end directly on
      # your computer, start it with REDIS_PORT=6380.
      - "6380:6379"

  # Prometheus collects metrics from every copy of every service every 5 seconds
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: commercehub_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Grafana shows the CommerceHub dashboard (requests/sec, p95 latency, errors, cache, Kafka...)
  grafana:
    image: grafana/grafana:11.2.0
    container_name: commercehub_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ---------- The application itself (only with --profile app) ----------

  # The shop back end, 2 copies. They share nothing in memory: data is in PostgreSQL,
  # cache / counters / locks in Redis, so any copy can answer any request.
  backend:
    profiles: ["app"]
    build: ./backend
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "3"
          memory: 768M
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/commercehub
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      REDIS_HOST: redis
      # Set REDIS_ENABLED=false to measure the "before" numbers (no cache, no stock gate)
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      APP_CORS_ALLOWED_ORIGIN: http://localhost:8080
      DEMO_FAILURE_RATE: ${DEMO_FAILURE_RATE:-0}
      # A customer who got a unit from the stock gate waits up to 30 s for an order slot
      # (a slow laptop can take longer than the default 10 s during a flash sale)
      APP_CHECKOUT_SLOT_WAIT_MILLIS: 30000
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
      - redis

  notification-service:
    profiles: ["app"]
    build: ./notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notifications-db:5432/notifications
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    restart: unless-stopped
    depends_on:
      - notifications-db
      - kafka

  # nginx: serves the React app and load-balances /api between the back-end copies
  web:
    profiles: ["app"]
    build: ./frontend
    container_name: commercehub_web
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend
      - notification-service

volumes:
  commercehub_data:
  notifications_data:
