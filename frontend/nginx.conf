# nginx: serves the React app and load-balances the API.
#
# "backend" is the Docker service name. When it runs as several copies (replicas), Docker's
# DNS returns all of their addresses and nginx shares requests between them (round robin).
# "resolve" makes nginx ask Docker's DNS again every few seconds, so copies that are added,
# replaced or restarted with a new address are picked up without restarting nginx.
# If one copy stops answering, nginx stops sending to it for a few seconds.

resolver 127.0.0.11 valid=5s ipv6=off;

upstream commercehub_api {
    zone commercehub_api 64k;
    server backend:8090 resolve max_fails=2 fail_timeout=5s;
    keepalive 64;
}

upstream notification_api {
    zone notification_api 64k;
    server notification-service:8091 resolve;
    keepalive 16;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Health and metrics stay inside the Docker network (Prometheus reads them directly)
    location /actuator {
        return 404;
    }

    location /api/ {
        proxy_pass http://commercehub_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        # If a copy is down, try another one. nginx never re-sends a POST that already
        # reached a server, so a checkout can never be placed twice by this retry.
        proxy_next_upstream error timeout http_502 http_503;
    }

    # The notification service (order timeline). /notify/x is passed on as /x.
    location /notify/ {
        proxy_pass http://notification_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # React Router: any other path loads the app
    location / {
        try_files $uri /index.html;
    }
}
