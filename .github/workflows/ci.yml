# Runs on every push and pull request: all tests for both services, the React build,
# and a check that every Docker image still builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Shop back end - tests
        working-directory: backend
        run: mvn -B verify
      - name: Notification service - tests
        working-directory: notification-service
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: React app - type check and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  docker-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose --profile app build
