spring.application.name=commercehub
server.port=8090

# PostgreSQL runs in Docker on port 5435 (see docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5435/commercehub
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# No secrets in code: override these with environment variables outside local development
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
jwt.expiry-hours=24

# Sample data and demo accounts created on first start (local development only)
app.seed.enabled=true
app.seed.admin-email=admin@commercehub.local
app.seed.admin-password=${ADMIN_PASSWORD:admin123}

# The React app runs on this address during development
app.cors.allowed-origin=http://localhost:5173
