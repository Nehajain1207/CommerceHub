spring.application.name=commercehub
server.port=8090

# PostgreSQL runs in Docker on port 5435 (see docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5435/commercehub
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# The schema is created and changed ONLY by the SQL files in db/migration (Flyway).
# Hibernate just checks at start-up that the tables match the Java classes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# No secrets in code: override these with environment variables outside local development
jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
jwt.expiry-hours=24

# Sample data and demo accounts created on first start (local development only)
app.seed.enabled=true
app.seed.admin-email=admin@commercehub.local
app.seed.admin-password=${ADMIN_PASSWORD:admin123}

# The React app runs on this address during development
app.cors.allowed-origin=http://localhost:5173

# Payments. Leave the keys empty to run in demo mode (no account needed).
# With Razorpay TEST keys set as environment variables, the real payment window is used.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# An order that is not paid within this many minutes is cancelled and its stock released
app.payment.window-minutes=15

# Order events. Events are always written to the outbox table; when Kafka is enabled
# they are also sent to this topic. If Kafka is down they wait in the table and are sent later.
app.kafka.enabled=true
app.kafka.order-events-topic=commercehub.order-events
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000

# ---------- Scaling and reliability ----------
# Redis: catalogue cache, flash-sale stock gate, rate limits, outbox leader lock.
# Redis only makes things faster; if it is down the app carries on using PostgreSQL alone.
app.redis.enabled=${REDIS_ENABLED:true}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Redis is used directly (cache, counters, locks), not as a Spring Data repository store
spring.data.redis.repositories.enabled=false
# Generous enough for a busy laptop running the load generator too; a timeout makes the
# Redis features step aside, which in a flash sale sends everyone to the database queue.
spring.data.redis.timeout=3s

# How long catalogue pages stay cached (stock shown while browsing may lag by this much)
app.cache.ttl-seconds=10
# How long the stock gate trusts its Redis counter before reloading it from the database
app.stock-gate.ttl-seconds=30

# Rate limits per user (shared by all copies of the back end, because they live in Redis)
app.ratelimit.checkout.limit=5
app.ratelimit.checkout.window-seconds=10
app.ratelimit.login.limit=10
app.ratelimit.login.window-seconds=60

# Bulkhead: at most this many order transactions at once per server. Others wait (up to
# 10 s) without holding a database connection, so browsing and the stock gate stay fast.
app.checkout.max-concurrent-orders=8
app.checkout.slot-wait-millis=10000

# Database connection pool. Wait at most 5 s for a free connection, then answer 503
# instead of letting requests pile up.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=5000

# Chaos testing only: share of demo payment calls that fail on purpose (0 = never)
app.payment.demo-failure-rate=${DEMO_FAILURE_RATE:0}

# Finish requests already in progress before shutting down (no half-done checkouts on deploy)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Health checks and Prometheus metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=${REDIS_ENABLED:true}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.host=${HOSTNAME:local}
