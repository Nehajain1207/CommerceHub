# Prometheus reads /actuator/prometheus from every running copy of each service.
global:
  scrape_interval: 5s

scrape_configs:

  # Back-end copies running in Docker (docker compose --profile app). Docker's DNS returns
  # one address per copy, so each copy is scraped separately.
  - job_name: commercehub-backend
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 8090
        refresh_interval: 10s

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["notification-service"]
        type: A
        port: 8091
        refresh_interval: 10s

  # The same services when you run them directly on your computer (mvnw spring-boot:run)
  - job_name: commercehub-backend-local
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8090"]

  - job_name: notification-service-local
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8091"]
